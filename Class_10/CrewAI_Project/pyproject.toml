[project]
name = "crewai_project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hafiz Rizwan", email = "hafizmr7788@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "crewai>=1.15.1",
    "litellm>=1.90.1",
    "python-dotenv>=1.2.2",
]

[project.scripts]
crewai = "crewai_project:main"
chain_prompt="crewai_project.Prompt_Chaining:start_func"
router_run="crewai_project.Router:start_func"
router_plot="crewai_project.Router:ploting"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"
